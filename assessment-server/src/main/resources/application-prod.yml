spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
  quartz:
    # 业务 Job、恢复/对账与唯一执行方切换完成后才启用。
    auto-startup: ${QUARTZ_AUTO_STARTUP:false}
absolute:
  jwt:
    secret: ${JWT_SECRET}
    suffix: ${AUTH_REDIS_SUFFIX}
app:
  readiness:
    schema-check-enabled: ${SCHEMA_CHECK_ENABLED:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db,redis,sharedAuth,sharedSchema
