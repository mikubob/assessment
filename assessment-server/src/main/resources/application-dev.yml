spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/assessment?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:assessment}
    password: ${DB_PASSWORD:}
management:
  # 基础框架可脱离外部服务启动；认证失败时仍拒绝访问。
  health:
    db:
      enabled: false
    redis:
      enabled: false
